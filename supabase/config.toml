project_id = "child-reward-system"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Matches the linked remote (17.6.1.063). Keep these in step, otherwise
# `supabase start` runs a different Postgres major than production.
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# DANGER: these values configure the LOCAL stack only. `supabase config push`
# is declarative and would overwrite the remote project's Site URL with the
# localhost value below — which is exactly the misconfiguration that sends
# Google SSO back to http://localhost:3000/?code=... instead of the app.
# Manage the deployed allow-list in the dashboard (Authentication > URL
# Configuration) and do not run `config push` against this project.
#
# Deployed values, for reference:
#   Site URL:  https://child-reward-system.vercel.app
#   Redirects: https://child-reward-system.vercel.app/**
#              https://child-reward-system-*-nitin27mays-projects.vercel.app/**
#              http://localhost:3000/**
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "https://127.0.0.1:3000",
  "http://localhost:3000/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false
port = 54327
backend = "postgres"
